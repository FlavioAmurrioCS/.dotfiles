################################################################################
# Location Docs: https://github.com/tmux/tmux/blob/master/tmux.1 (FILES section; man.openbsd.org lacks the ~/.config paths)
# Location User: ~/.config/tmux/tmux.conf
# Location Repo: none (tmux has no project-level config)
# Location Check: tmux start \; show -g prefix \; show -g history-limit (C-a and 50000 when loaded)
################################################################################

# remap prefix from 'C-b' to 'C-a'
# unbind C-b # Maybe keep default behavior
set-option -g prefix C-a
bind-key C-a send-prefix

# # split panes using | and -
# bind | split-window -h
# bind \\ split-window -h
# bind - split-window -v
# # unbind '"' # Maybe keep default behavior
# # unbind % # Maybe keep default behavior

bind r source-file ~/.config/tmux/tmux.conf

set -g history-limit 50000
set -g default-terminal "xterm-256color"

run-shell 'tmux setenv -g TMUX_VERSION $(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\\1/p")'
set -g base-index 1

# Status Bar Configuration
set -g status-justify centre
set -g status-bg black
set -g status-fg white
set -g status-left-length 90
set -g status-left '#[bold,fg=blue][ #[default]#[fg=green]#H#[default] #[fg=yellow]::#[fg=magenta] {#[fg=green]#S#[fg=magenta]} #[bold,fg=blue]] ['
set -g status-right-length 70
set -g status-right '#[bold,fg=blue]] [ #[default,fg=green]#(date '+%m/%d') #[fg=yellow]#(date '+%H:%M') #[default,bold,fg=blue]]'
set-window-option -g window-status-current-format '#[fg=red](#[fg=cyan]#I#F#W#[fg=red]) '
set-window-option -g window-status-format '#[fg=green]#I#F#W '

set -g mouse on
