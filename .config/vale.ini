# Vale config for this repo's docs only; mise doesn't link it into ~. The user
# config is .config/vale/.vale.ini, which vale also reads unless --no-global.
# Run `vale sync` after changing Packages. Synced styles land in styles/ at the
# repo root (StylesPath is relative to this file) and are ignored by git,
# except the Vocab in styles/config/vocabularies/Project.
StylesPath = ../styles
MinAlertLevel = suggestion
Vocab = Project

Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[formats]
COMMIT_EDITMSG = md

[*.md]
BasedOnStyles = Vale, Google, ai-tells

# The vale-commit-msg hook runs `vale --path=COMMIT_EDITMSG` on stdin.
[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits

# Third-party repos (git submodules): no styles, so `vale .` skips them.
[external/**]
BasedOnStyles =
