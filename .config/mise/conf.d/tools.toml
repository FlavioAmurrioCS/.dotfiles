#:schema https://mise.jdx.dev/schema/mise.json
################################################################################
# Location Docs: https://mise.jdx.dev/configuration.html#configuration-hierarchy
# Location User: ~/.config/mise/conf.d/tools.toml
# Location Repo: ./.config/mise/conf.d/tools.toml
# Location Check: mise config ls
################################################################################
# Tools for every machine, work machines included. Keep this list short.
# Linters for this repo are in its mise.toml. Anything for one machine goes in
# the untracked ~/.config/mise/config.toml, where `mise use -g` writes.

[settings]
pin = true
# packslip (the registry default for worktrunk) also installs the agent skills
# a tool declares, and on a fresh home that fails the whole `mise install`.
# mise falls back to the next backend in the registry (aqua for worktrunk).
disable_backends = ["packslip"]

[tools]
fd = "latest"
fzf = "latest"
git-lfs = "latest"
neovim = "latest"
ripgrep = "latest"
tmux = "latest"
worktrunk = { version = "latest", workflow = "release.yaml" }
