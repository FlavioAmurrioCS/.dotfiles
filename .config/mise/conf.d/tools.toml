#:schema https://mise.jdx.dev/schema/mise.json
################################################################################
# Location Docs: https://mise.jdx.dev/configuration.html#configuration-hierarchy
# Location User: ~/.config/mise/conf.d/tools.toml
# Location Repo: ./.config/mise/conf.d/tools.toml
# Location Check: mise config ls
################################################################################
# Tools for every machine, work machines included. Keep this list short.
# Linters for this repo are in its mise.toml. Anything for one machine goes in
# the untracked ~/.config/mise/config.toml, where `mise use -g` writes.

[settings]
pin = true

[tools]
fd = "10.5.0"
fzf = "0.74.5"
git-lfs = "3.8.1"
neovim = "0.12.6"
ripgrep = "15.2.0"
tmux = "3.7c"
worktrunk = { version = "0.81.0", workflow = "release.yaml" }
