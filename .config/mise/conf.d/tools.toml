#:schema https://mise.jdx.dev/schema/mise.json
################################################################################
# Location Docs: https://mise.jdx.dev/configuration.html#configuration-hierarchy
# Location User: ~/.config/mise/conf.d/tools.toml
# Location Repo: ./.config/mise/conf.d/tools.toml
# Location Check: mise config ls
################################################################################
# Every tool for every machine, declared once. Work-only tools go in the work
# repo's dotfiles-work.toml; one-off experiments go in the untracked
# ~/.config/mise/config.toml.

[settings]
pin = true

# `mise use -g` and `mise dot add` write here instead of config.toml.
[settings.write_targets]
tools = "~/.config/mise/conf.d/tools.toml"
dotfiles = "~/.config/mise/conf.d/dotfiles.toml"

[tools]
claude = "2.1.310"
delta = "0.20.1"
dive = "0.13.1"
fzf = "0.74.5"
gdu = "5.38.0"
git-lfs = "3.8.1"
github-cli = "2.103.2"
neovim = "0.12.6"
opencode = "1.19.4"
tmux = "3.7c"
uv = "0.13.5"

# Linters and formatters, also used by this repo's pre-commit hooks.
betterleaks = "1.9.0"
"github:ewhauser/shuck" = "0.2.7"
"github:owenlamont/ryl" = "0.26.0"
pre-commit = "4.7.0"
ripsecrets = "0.1.11"
ruff = "0.17.2"
rumdl = "0.3.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.9.5"
ty = "0.0.91"
vale = "3.25.1"

# Python CLI tools from PyPI. Editable installs of local checkouts (dev-toolbox,
# marimo, python-metadata-parser, switchbot-cli) stay as `uv tool install -e`.
copier = "9.19.1"
hatch = "1.18.1"
"pypi:go-to-wheel" = "0.2"
"pypi:hf" = "1.26.0"
"pypi:virtualenv" = "21.5.1"
