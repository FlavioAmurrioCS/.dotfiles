################################################################################
# Location Docs: https://github.com/vale-cli/vale.sh/blob/svelte/docs/topics/.vale.ini.md#search
# Location User: ~/.config/vale/.vale.ini
# Location User macOS: ~/Library/Application Support/vale/.vale.ini (needed unless XDG_CONFIG_HOME is set)
# Location Repo: none (this repo's docs use ./.config/vale.ini)
# Location Check: vale ls-config | grep -A3 ConfigFiles
################################################################################
# StylesPath is left at vale's default (`vale ls-dirs` prints it; on macOS
# ~/Library/Application Support/vale/styles), so synced packages stay out of
# this repo. Run `vale sync` after changing Packages.
# Only ai-tells here: vale merges this file into every repo. Google and Vale's
# spelling need a per-repo Vocab, so they go in each repo's own config.
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[*.md]
BasedOnStyles = ai-tells

[formats]
COMMIT_EDITMSG = md

# The vale-commit-msg hook runs `vale --path=COMMIT_EDITMSG` on stdin.
[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits
